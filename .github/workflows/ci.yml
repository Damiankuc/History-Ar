name: History-Ar CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-check:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Web Bundle
        run: |
          cd frontend
          npm run build

  backend-check:
    name: Backend Tests & Quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: app
          REQUIRE_AUTH: "false"
          SUPABASE_URL: "https://qvutqqfsypzcfjhhzqsk.supabase.co"
          SUPABASE_KEY: "sb_publishable_KT61xj__yMLdxD37Wc5Teg_RFfQz6Rm"
        run: |
          cd backend
          python -m pytest
